version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bugsense-postgres
    environment:
      POSTGRES_USER: bugsense
      POSTGRES_PASSWORD: bugsense_password
      POSTGRES_DB: bugsense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugsense"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: bugsense-backend
    environment:
      - DATABASE_URL=postgresql://bugsense:bugsense_password@postgres:5432/bugsense
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - AI_PROVIDER=${AI_PROVIDER}
      - AI_API_KEY=${AI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.venv

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: bugsense-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:

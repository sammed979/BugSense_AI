services:
  - type: web
    name: bugsense-ai-backend
    env: python
    rootDirectory: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1,bugsense-ai-backend.onrender.com,*.onrender.com"
      - key: DATABASE_ENGINE
        value: "postgresql"
      - key: DB_NAME
        fromDatabase:
          name: bugsense-db
          property: databaseName
      - key: DB_USER
        fromDatabase:
          name: bugsense-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bugsense-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: bugsense-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bugsense-db
          property: port
      - key: FRONTEND_URL
        value: "https://bugsenseai-frontend.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://bugsenseai-frontend.vercel.app,http://localhost:8000,http://127.0.0.1:8000"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: EXECUTION_ENABLED
        value: "True"
      - key: EXECUTION_TIMEOUT_SECONDS
        value: "5"
      - key: EXECUTION_MEMORY_LIMIT_MB
        value: "128"
      - key: EXECUTION_MAX_OUTPUT_BYTES
        value: "65536"
      - key: REPAIR_MAX_ATTEMPTS
        value: "3"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o"
      - key: AI_PROVIDER_PRIORITY
        value: "gemini,openai,heuristic"

databases:
  - name: bugsense-db
    databaseName: bugsense
    user: bugsense

{% extends 'base.html' %}

{% block content %}
<div class="learning-container">
    <h1>Learning Centre</h1>

    <div class="learning-categories">
        <button class="category-btn active" data-category="all">All Topics</button>
        <button class="category-btn" data-category="errors">Python Errors</button>
        <button class="category-btn" data-category="debugging">Debugging</button>
        <button class="category-btn" data-category="testing">Testing</button>
    </div>

    <div id="topics-list" class="topics-list">
        <p>Loading topics...</p>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.learning-container {
    max-width: 1200px;
    margin: 0 auto;
}

.learning-categories {
    display: flex;
    gap: 1rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
}

.category-btn {
    padding: 0.5rem 1rem;
    border: 1px solid var(--border-color);
    background-color: var(--surface-color);
    border-radius: 0.375rem;
    cursor: pointer;
}

.category-btn.active {
    background-color: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
}

.topics-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
}

.topic-card {
    background-color: var(--surface-color);
    padding: 1.5rem;
    border-radius: 0.5rem;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-color);
}

.topic-card h3 {
    margin-bottom: 0.5rem;
}

.topic-card .category {
    display: inline-block;
    padding: 0.25rem 0.5rem;
    background-color: var(--secondary-color);
    color: white;
    border-radius: 0.25rem;
    font-size: 0.75rem;
    margin-bottom: 0.5rem;
}
</style>
{% endblock %}

{% block extra_js %}
<script src="/static/js/learning.js"></script>
<script>
    loadLearningTopics();
</script>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="projects-container">
    <h1>Projects</h1>

    <div class="projects-header">
        <button id="create-project" class="btn btn-primary">Create Project</button>
        <button id="upload-project" class="btn btn-secondary">Upload ZIP</button>
    </div>

    <div id="projects-list" class="projects-list">
        <p>Loading projects...</p>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.projects-container {
    max-width: 1200px;
    margin: 0 auto;
}

.projects-header {
    display: flex;
    gap: 1rem;
    margin-bottom: 2rem;
}

.projects-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
}

.project-card {
    background-color: var(--surface-color);
    padding: 1.5rem;
    border-radius: 0.5rem;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-color);
}

.project-card h3 {
    margin-bottom: 0.5rem;
}

.project-card p {
    color: var(--text-secondary);
    margin-bottom: 1rem;
}
</style>
{% endblock %}

{% block extra_js %}
<script src="/static/js/projects.js"></script>
<script>
    loadProjects();
</script>
{% endblock %}
